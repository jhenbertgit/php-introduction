[PHP]

; Logging
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /var/log/php_errors.log

; Uploads
file_uploads = On
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 30

; Session
session.save_handler = files
session.save_path = /tmp

; Security
expose_php = Off
allow_url_fopen = Off
allow_url_include = Off

; Locale
date.timezone = UTC
